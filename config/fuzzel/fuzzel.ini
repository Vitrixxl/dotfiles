# fuzzel — launcher Wayland natif (Hyprland + niri).
# Sobre, aéré, sans accent criard. Palette reprise de hypr/hyprtoolkit.conf.
# Navigation : Ctrl+N / Ctrl+P (ou flèches), voir [key-bindings].

[main]
font=Geist:size=13
prompt=""
placeholder=Rechercher…
terminal=foot -e
layer=overlay
icon-theme=Adwaita
icons-enabled=yes
lines=9
width=44
horizontal-pad=22
vertical-pad=18
inner-pad=12
line-height=26
match-counter=no
# les applis fréquentes remontent en tête
sort-result=yes

[colors]
# RRGGBBAA — fond opaque (blur désactivé dans Hyprland)
background=0f1115ff
text=e6e9efff
prompt=e6e9efff
placeholder=6b7280ff
input=e6e9efff
match=ffffffff
selection=1c2029ff
selection-text=ffffffff
selection-match=ffffffff
counter=6b7280ff
border=00000000

[border]
width=0
radius=14

[key-bindings]
next=Down Control+n
prev=Up Control+p
