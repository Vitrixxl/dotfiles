# Artix/runit : pas de systemd user session pour demarrer wireplumber et
# pipewire-pulse. On les fait lancer par pipewire lui-meme, qui devient donc
# le seul processus a demarrer (via spawn-at-startup dans niri).
context.exec = [
    { path = "/usr/bin/wireplumber"    args = "" }
    { path = "/usr/bin/pipewire-pulse" args = "" }
]
