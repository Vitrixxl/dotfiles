# Laisser niri gérer entièrement les décorations :
# pas de barre de titre dessinée par foot, juste le border/focus-ring de niri.
[csd]
preferred=none
[main]
font=Geist Mono Font:size=10
# Marge intérieure (horizontale x verticale), en pixels
pad=20x20
# Couleurs générées par Nexus (mode clair/sombre et accent du wallpaper) ;
# Nexus bascule les fenêtres ouvertes quand le mode change.
include=~/.config/nexus/foot.ini
