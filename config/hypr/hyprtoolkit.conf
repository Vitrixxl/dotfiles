# Thème hyprtoolkit — utilisé par les outils hypr* basés sur hyprtoolkit (hyprland-guiutils…).
# Le launcher (fuzzel) reprend la même palette dans ~/.config/fuzzel/fuzzel.ini.
# Couleurs : rgba(RRGGBBAA). Accent aligné sur hyprlock (7fc8ff).

# Surfaces
background      = rgba(0f1115ff)   # fenêtre, opaque (blur désactivé dans hyprland.lua)
base            = rgba(161920ff)   # champ de saisie
alternate_base  = rgba(1c202900)   # alpha 0 : neutralise la bordure du champ de saisie (hyprtoolkit)

# Texte
text            = rgba(e6e9efff)
bright_text     = rgba(ffffffff)
link_text       = rgba(7fc8ffff)

# Accent
accent          = rgba(7fc8ffff)
accent_secondary = rgba(5aa0e6ff)

# Formes
rounding_large  = 14
rounding_small  = 8

# Typo
font_family           = Geist
font_family_monospace = Geist Mono
h1_size         = 20
h2_size         = 16
h3_size         = 14
font_size       = 13
small_font_size = 11

icon_theme      = Adwaita
