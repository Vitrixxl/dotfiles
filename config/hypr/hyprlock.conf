# hyprlock : capture de l'écran floutée en fond, champ de mot de passe au centre.
general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.01
    brightness = 0.8
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = rgba(7fc8ffcc)
    inner_color = rgba(1e1e1ecc)
    font_color = rgb(ffffff)
    fade_on_empty = false
    placeholder_text = <i>Mot de passe</i>
    fail_text = <i>$FAIL</i>
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    font_size = 72
    font_family = Liberation Sans
    color = rgb(ffffff)
    position = 0, 120
    halign = center
    valign = center
}
