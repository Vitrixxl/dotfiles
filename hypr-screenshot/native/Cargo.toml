[package]
name = "hypr-screenshot-native"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[dependencies]
smithay-client-toolkit = { version = "0.20", default-features = false }
wayland-client = { version = "0.31", features = ["system"] }
wayland-protocols = { version = "0.32", features = ["client"] }
wayland-egl = "0.32"
glow = "0.16"
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1"
tempfile = "3"
libc = "0.2"
anyhow = "1"

[profile.release]
lto = "thin"
strip = true
